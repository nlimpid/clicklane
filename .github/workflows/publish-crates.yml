name: Publish Crates

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.repository == 'nlimpid/clicklane'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish clickup
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p clickup --locked

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish clickup-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p clickup-cli --locked
