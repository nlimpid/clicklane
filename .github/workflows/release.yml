name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Clicklane ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  cli:
    needs: release-meta
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Add macOS targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build clickup-cli binaries
        run: |
          cargo build -p clickup-cli --release --target x86_64-apple-darwin --locked
          cargo build -p clickup-cli --release --target aarch64-apple-darwin --locked
          mkdir -p dist/cli
          cp target/x86_64-apple-darwin/release/clickup-cli dist/cli/clickup-cli-x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/clickup-cli dist/cli/clickup-cli-aarch64-apple-darwin

      - name: Upload clickup-cli release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/cli/clickup-cli-x86_64-apple-darwin
            dist/cli/clickup-cli-aarch64-apple-darwin

  tauri:
    needs: release-meta
    runs-on: macos-latest
    strategy:
      max-parallel: 1
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload Clicklane
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Clicklane ${{ github.ref_name }}
          releaseBody: See the release assets for the Clicklane macOS bundles and clickup-cli binaries.
          releaseDraft: false
          prerelease: false
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }}
